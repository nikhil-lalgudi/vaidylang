name: CPU inference

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CUDA_VISIBLE_DEVICES: ""
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      GLOO_SOCKET_IFNAME: lo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.14"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .github/requirements-cpu.txt
      - name: Check pinned upstream prompt and tokenizer parity
        run: |
          revision=314113f8a7dadb388215396ba5fbee2c610a04d6
          source="https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/resolve/$revision"
          VAIDYLANG_DEEPSEEK_METADATA="$RUNNER_TEMP/deepseek-v41"
          echo "VAIDYLANG_DEEPSEEK_METADATA=$VAIDYLANG_DEEPSEEK_METADATA" >> "$GITHUB_ENV"
          mkdir -p reports
          python -m tools.deepseek_upstream_checks --list-files > "$RUNNER_TEMP/upstream-files"
          while IFS= read -r asset; do
            target="$VAIDYLANG_DEEPSEEK_METADATA/$asset"
            mkdir -p "$(dirname "$target")"
            curl --fail --silent --show-error --location --retry 3 "$source/$asset" --output "$target"
          done < "$RUNNER_TEMP/upstream-files"
          python -m tools.deepseek_upstream_checks --upstream "$VAIDYLANG_DEEPSEEK_METADATA" \
            --report reports/upstream-checks.json
      - name: Require native E8M0, two-process Gloo, published token IDs and reduced vision
        run: |
          python -m unittest -v \
            test_checkpoint.CheckpointTests.test_native_quantized_storage_loads_from_both_deepseek_shards \
            test_deepseek_placement.DeepSeekPlacementTests.test_two_process_gloo_collectives \
            test_prompt_input.PublishedPromptTests.test_pinned_tokenizer_and_chat_ids \
            test_deepseek_vision.DeepSeekVisionTests.test_cli_generates_from_image_and_processes_metadata_without_weights \
            2>&1 | tee "$RUNNER_TEMP/required-tests.log"
          if grep -q '^OK (skipped=' "$RUNNER_TEMP/required-tests.log"; then
            exit 1
          fi
      - name: Run CPU tests
        run: python -m unittest -v
      - name: Run all 100 prompts
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m tools.deepseek_prompts freeze --checkpoint "$VAIDYLANG_DEEPSEEK_METADATA" \
            --output reports/prompts-frozen.json.gz
          for encoding in dense quantized; do
            dtype=()
            if [[ "$encoding" == dense ]]; then
              dtype+=(--dense)
            fi
            fixture="$RUNNER_TEMP/deepseek-$encoding"
            python -m deepseek_fixture "$fixture" --vision --context 4096 "${dtype[@]}" \
              --published-tokenizer "$VAIDYLANG_DEEPSEEK_METADATA/tokenizer.json"
            python -m tools.deepseek_prompts smoke --checkpoint "$fixture" --document-cap 512 --output-cap 8 \
              --output "reports/prompts-smoke-$encoding.json.gz"
          done
      - name: Retain on-demand reports
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deepseek-cpu-reports
          path: reports/
          retention-days: 30
          if-no-files-found: error

  container:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the CPU Dev Container
        run: npx --yes @devcontainers/cli@0.90.0 build --workspace-folder . --image-name vaidylang:cpu
      - name: Run the container unit suite
        run: docker run --rm vaidylang:cpu
